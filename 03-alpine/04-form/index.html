<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Document</title>
    <script
        src="https://unpkg.com/alpinejs"
        defer
    ></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>

<body>
    <form
        x-data="loadingData()"
        @submit.prevent="sending()"
    >
        <input
            type="text"
            class="p-2 border-2 border-gray-300 rounded"
            x-model="username"
        >
        <input
            type="text"
            class="p-2 border-2 border-gray-300 rounded"
            x-model="password"
        >
        <button
            type="submit"
            :class="condition ?  'bg-green-500 px-5 py-2 rounded-xl text-white cursor-pointer' : 'bg-green-300 cursor-not-allowed px-5 py-2 rounded-xl text-white'"
        >submit</button>
        <hr class="my-5">
        <!-- <span x-text="`username: ${username.length} | password: ${password.length}`"></span> -->
        <span
            x-text="getMessage()"
            x-bind:class="{'text-green-500': condition, 'text-red-500': !condition}"
        ></span>
    </form>
</body>
<script>
    function loadingData() {
        return {
            username: '',
            password: '',
            message: '',
            get condition() {
                return this.username.length > 0 && this.password.length > 0
            },
            getMessage() {
                if (this.condition) { return `condition fulfilled`; } else { return `condition not fulfilled`; }
            },
            sending() {
                if (this.condition) {
                    return console.log(`sending username: ${this.username} | password: ${this.password}`)
                }
            }
        }
    }
</script>

</html>
