        <button

<script>
    function ourData() {
        return {
            apiAdress: "https://jsonplaceholder.typicode.com/posts",
            userID: '',
            id: '',
            title: '',
            body: '',
            objectitize(a, b, c, d) {
                return {
                    userId: a,
                    id: b,
                    title: c,
                    body: d
                }
            },
            posts: [],
            init() {
                fetch(this.apiAdress)
                    .then(res => res.json())
                    .then(data => this.posts = data)
            },
            response: null,
            sending() {
                console.log('sending');
                fetch(this.apiAdress, {
                    method: 'POST',
                    body: JSON.stringify(this.objectitize(this.userID, this.id, this.title, this.body)),
                    headers: {
                        'Content-type': 'application/json; charset=UTF-8',
                    },
                })
                    .then((response) => response.json())
                    .then((json) => {
                        this.response = json;
                        console.log(json);
                    });
            }
        }
    }
</script>
