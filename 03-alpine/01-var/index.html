<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Document</title>
    <script
        src="https://unpkg.com/alpinejs"
        defer
    ></script>
</head>

<body>
    <div x-data="{name: 'Sercan', age: 26, male: true}">
        <!-- aware of the quote marker, you can't use any double marker anymore in this construct -->
        <div x-text="`my name is ${name}`"></div>
        <div x-text="`my age is ${age}`"></div>
        <div x-text="`male: ${true}`"></div>
    </div>
</body>

</html>
