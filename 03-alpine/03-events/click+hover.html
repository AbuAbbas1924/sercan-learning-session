<body>
    <div x-data="{variable: 'Musa', count: 0, leave: false}">
        <p>Salamulaikum <span x-text="variable"></span></p>
        <p x-text="`my counter is ${count}`"></p>
        <button @click="count += 1; leave=false">click button</button>
        <button
            @mouseenter="leave=false; count += 1"
            @mouseleave="leave=true"
        >hover button</button>
        <p x-show="leave">du hast dein buttonfeld verlassen</p>
