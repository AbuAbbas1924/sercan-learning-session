<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <script
        src="https://unpkg.com/alpinejs"
        defer
    ></script>
    <title>Document</title>
</head>

<body>
    <div
        x-data="{ count: 0, pressed: false }"
        x-init="console.log('initialization of alpine')"
    >
        <p x-text="`my counter is ${count}`"></p>
        <button @keydown.ctrl="console.log('ctrl clicked'); count++">local event: focused + type ctrl</button>
        <button @keydown.shift..window="console.log('shift clicked'); count--">global event: without focus + type shift
        </button>
    </div>
    <hr>
    <div x-data>
        <button
            type="button"
            @keydown.ctrl.shift.k="console.log('Ctrl + Shift + K pressed')"
        >
            globalEvent: Press Ctrl + Shift + K
        </button>
    </div>

</body>

</html>
