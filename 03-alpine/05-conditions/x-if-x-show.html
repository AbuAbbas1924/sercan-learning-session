<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Document</title>
    <script
        src="https://unpkg.com/alpinejs"
        defer
    ></script>
</head>

<body>
    <div x-data="{show: true, exist: true}">
        <div x-show="show">showing</div>
        <template x-if="exist">
            <div id="ex1">existing</div>
        </template>
        <button @click="show=!show">toggle showing</button>
        <button @click="exist=!exist">toggle existing</button>
    </div>
</body>

</html>
