<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workshop</title>
  </head>
  <body>
    <!--Baue ein Formular mit zwei zusammengehörigen Bereichen: „Persönliche Daten“ und „Buchung“.
Die Anforderungen:
1. Ein verpflichtender Benutzername mit mindestens 3 und höchstens 15 Zeichen.
2. Eine verpflichtende E-Mail-Adresse.
3. Eine verpflichtende Teilnehmerzahl zwischen 1 und 5 – nur ganze Zahlen.
4. Eine Auswahl zwischen „Online“ und „Vor Ort“ über zwei Radio-Buttons. Es darf nur eine Option auswählbar sein, und eine Auswahl ist erforderlich.
5. Drei unabhängig auswählbare Checkboxen für HTML, Linux und Git. Mehrere Themen dürfen gleichzeitig ausgewählt werden.
6. Ein optionales Anmerkungsfeld mit höchstens 200 Zeichen.
7. Einen Button „Buchung absenden“.  -->
    <form action="">
      <fieldset>
        <legend>Persönliche Daten</legend>
        <label for="Benutzername">Benutzername:</label>
        <input
          type="text"
          id="Benutzername"
          name="Benutzername"
          required
          minlength="3"
          maxlength="15"
        />
        <br /><br />
        <label for="email">E-Mail:</label>
        <input type="email" id="email" name="email" required />
        <br /><br />
      </fieldset>
      <fieldset>
        <legend>Buchung</legend>
        <label for="Teilnehmerzahl">Teilnehmerzahl:</label>
        <input
          type="number"
          id="Teilnehmerzahl"
          name="Teilnehmerzahl"
          step="1"
          min="1"
          max="5"
          required
        />
        <br /><br />
        <p>Teilnahmeart:</p>

        <input
          type="radio"
          id="online"
          name="Teilnahmeart"
          value="online"
          required
        />
        <label for="online">Online</label>
        <input
          type="radio"
          id="Vor-Ort"
          name="Teilnahmeart"
          value="Vor-Ort"
          required
        />
        <label for="Vor-Ort">Vor Ort</label>
        <br /><br />
        <p>Welche/n Kurs/e wollen Sie belegen?</p>
        <input type="checkbox" id="HTML" name="HTML" value="HTML" />
        <label for="HTML">HTML-Kurs</label>
        <input type="checkbox" id="Linux" name="Linux" value="Linux" />
        <label for="Linux">Linux-Kurs</label>
        <input type="checkbox" id="Git" name="Git" value="Git" />
        <label for="Git">Git-Kurs</label>
        <br /><br />
        <label for="Anmerkungen">Deine Anmerkungen oder Fragen:</label>
        <textarea
          name="Anmerkungen"
          id="Anmerkungen"
          placeholder="(Optional)-Anmerkungen oder Fragen?"
          maxlength="200"
        ></textarea>
        <br /><br />
        <button type="submit">Buchung absenden</button>
      </fieldset>
    </form>
  </body>
</html>
