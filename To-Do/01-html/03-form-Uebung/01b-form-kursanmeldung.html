<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kursanmeldung</title>
  </head>
  <body>
    <!-- Baue ein Formular mit:
1. Einer Überschrift „Anmeldung zum IT-Kurs“.
2. Pflichtfeldern für Vorname und E-Mail-Adresse. Verwende für die E-Mail den passenden Eingabetyp.
3. Einer Kursauswahl mit den Optionen HTML, Linux und Git.
4. Einem optionalen Textfeld für Anmerkungen, in dem mehrere Zeilen möglich sind.
5. Einer Checkbox „Ich habe die Teilnahmebedingungen gelesen“, die angekreuzt werden muss.
6. Einem Absende-Button „Anmelden“ und einem Button „Zurücksetzen“, der die Eingaben auf ihre Anfangswerte zurücksetzt. -->

    <h1>Anmeldung zum IT-Kurs</h1>
    <form action="">
      <label for="Vorname">Vorname:</label>
      <input type="text" id="Vorname" name="Vorname" required />
      <br />
      <label for="Nachname">Nachname:</label>
      <input type="text" id="Nachname" name="Nachname" required />
      <br />
      <label for="E-Mail-Adresse">E-Mail-Adresse:</label>
      <input type="email" id="E-Mail-Adresse" name="E-Mail-Adresse" required />
      <br />
      <br />
      <label for="Kursauswahl">Kurs auswählen:</label>
      <select name="Kursauswahl" id="Kursauswahl">
        <option value="HTML">HTML</option>
        <option value="Linux">Linux</option>
        <option value="Git">Git</option>
      </select>
      <br />
      <br />
      <label for="Anmerkungen">Anmerkungen:</label>
      <textarea
        name="Anmerkungen"
        id="Anmerkungen"
        rows="4"
        placeholder="Hier kannst du Anmerkungen eintragen"
      ></textarea>
      <br />
      <br />
      <label for="Teilnahmebedingungen"
        >Ich habe die Teilnahmebedingungen gelesen</label
      >
      <input
        type="checkbox"
        id="Teilnahmebedingungen"
        name="Teilnahmebedingungen"
        required
        value="akzeptiert"
      />
      <br />
      <button type="submit">Anmelden</button>
      <br />
      <button type="reset">Zurücksetzen</button>
    </form>
  </body>
</html>
