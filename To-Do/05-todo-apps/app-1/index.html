<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meine To-do-App</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x" defer></script>
  </head>

  <body class="bg-gray-100 p-8">
    <!-- x-data stellt unsere Daten innerhalb von main bereit. -->
    <main x-data="todoApp()" class="bg-white mx-auto p-6 rounded-lg max-w-lg">
      <h1 class="mb-6 font-bold text-3xl">Meine To-do-App</h1>
      <p class="mb-4 text-gray-600" x-text="apiNachricht"></p>

      <label for="aufgabe" class="block mb-2">Neue Aufgabe:</label>

      <!-- x-model verbindet das Eingabefeld mit neueAufgabe. -->
      <input
        id="aufgabe"
        type="text"
        x-model="neueAufgabe"
        placeholder="Was möchtest du erledigen?"
        class="mb-4 p-2 border border-gray-300 rounded w-full"
      />

      <button
        @click="hinzufuegen()"
        type="button"
        class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white"
      >
        Hinzufügen
      </button>

      <!-- Zeigt alle hinzugefügten Aufgaben an. -->
      <ul class="mt-4">
        <template x-for="aufgabe in aufgaben" :key="aufgabe.id">
          <li class="bg-gray-100 mb-2 p-2 rounded" x-text="aufgabe.titel"></li>
        </template>
      </ul>
    </main>

    <script>
      function todoApp() {
        return {
          neueAufgabe: "",
          aufgaben: [],
          apiNachricht: "",

          async init() {
            await this.laden();
          },

          async laden() {
            try {
              const response = await fetch("http://127.0.0.1:8000/aufgaben");

              if (!response.ok) {
                throw new Error("Laden fehlgeschlagen");
              }

              this.aufgaben = await response.json();
              this.apiNachricht = "Aufgaben geladen.";
            } catch (error) {
              this.apiNachricht = "Die Aufgaben konnten nicht geladen werden.";
              console.error(error);
            }
          },

          async hinzufuegen() {
            const text = this.neueAufgabe.trim();

            if (text === "") {
              return;
            }

            try {
              const response = await fetch("http://127.0.0.1:8000/aufgaben", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  titel: text,
                }),
              });

              if (!response.ok) {
                throw new Error("Speichern fehlgeschlagen");
              }

              const gespeicherteAufgabe = await response.json();

              this.aufgaben.push(gespeicherteAufgabe);
              this.neueAufgabe = "";
              this.apiNachricht = "Aufgabe gespeichert.";
            } catch (error) {
              this.apiNachricht =
                "Die Aufgabe konnte nicht gespeichert werden.";
              console.error(error);
            }
          },
        };
      }
    </script>
  </body>
</html>
