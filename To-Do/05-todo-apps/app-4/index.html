<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do by FiSi-Schmarotzer</title>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-slate-400 p-10">
    <header
      class="bg-[url('https://media.tenor.com/Qfuw6SNFaOYAAAAi/copy-paste.gif')] bg-auto bg-blue-200 bg-no-repeat bg-right p-24 border border-2 font-bold text-4xl text-center"
    >
      <h1>FiSi-Schmarotzer baut To-do app</h1>
    </header>

    <main
      class="bg-sky-200 mx-auto mt-10 p-8 border-2 rounded-xl max-w-3xl"
      x-data="toDO()"
    >
      <h2 class="mb-8 font-bold text-4xl text-center">Meine Aufgaben</h2>

      <section class="mb-8">
        <h3 class="mb-4 font-bold text-xl">Neue Aufgabe hinzufügen</h3>

        <div class="flex gap-3">
          <input
            type="text"
            placeholder="Neue Aufgabe eingeben ..."
            class="flex-1 bg-white p-3 border-2 border-slate-400 rounded-lg min-w-0"
            x-model="neueAufgabe"
          />

          <button
            type="button"
            class="bg-blue-600 hover:bg-blue-700 px-5 py-3 rounded-lg font-bold text-white cursor-pointer"
            @click="hinzufuegen()"
          >
            Hinzufügen
          </button>
        </div>
      </section>

      <div class="gap-6 grid grid-cols-1 md:grid-cols-2">
        <!--Offene Aufgaben(Box)-->
        <section class="bg-slate-100 p-4 rounded-xl">
          <h3 class="mb-4 font-bold text-xl">
            Offen (<span class="" x-text="offeneAufgaben.length"></span>)
          </h3>
          <p x-show="offeneAufgaben.length === 0" class="text-slate-500">
            Keine offenen Aufgaben
          </p>
          <ul class="space-y-3">
            <template x-for="aufgabe in offeneAufgaben" :key="aufgabe.id">
              <li
                class="bg-white shadow-sm p-4 border border-slate-300 rounded-lg"
              >
                <label class="flex items-center gap-3 cursor-pointer">
                  <input
                    class="w-5 h-5 accent-blue-600 shrink-0"
                    type="checkbox"
                    :checked="aufgabe.completed"
                    @change="statusAendern(aufgabe, $event)"
                  />
                  <span
                    x-text="aufgabe.titel"
                    class="text-lg"
                    :class="{ 'line-through text-slate-500': aufgabe.completed}"
                  ></span>
                </label>
              </li>
            </template>
          </ul>
        </section>

        <!--Abgeschlossene Aufgaben(Box)-->
        <section class="bg-slate-100 p-4 rounded-xl">
          <h3 class="mb-4 font-bold text-xl">
            Abgeschlossen (<span x-text="abgeschlosseneAufgaben.length"></span>)
          </h3>
          <p x-show="abgeschlosseneAufgaben.length === 0" class="text-slate-500">
            Noch keine Aufgabe abgeschlossen
          </p>
          <ul class="space-y-3">
            <template
              x-for="aufgabe in abgeschlosseneAufgaben"
              :key="aufgabe.id"
            >
              <li
                class="bg-white shadow-sm p-4 border border-slate-300 rounded-lg"
              >
                <label class="flex items-center gap-3 cursor-pointer">
                  <input
                    class="w-5 h-5 accent-blue-600 shrink-0"
                    type="checkbox"
                    :checked="aufgabe.completed"
                    @change="statusAendern(aufgabe, $event)"
                  />
                  <span
                    x-text="aufgabe.titel"
                    class="text-lg"
                    :class="{ 'line-through text-slate-500': aufgabe.completed}"
                  ></span>
                </label>
              </li>
            </template>
          </ul>
        </section>
      </div>
    </main>

    <script>
      function toDO() {
        return {
          endpoint: "http://127.0.0.1:8000",
          neueAufgabe: "",
          aufgaben: [],
          get offeneAufgaben() {
            return this.aufgaben.filter((aufgabe) => !aufgabe.completed);
          },
          get abgeschlosseneAufgaben() {
            return this.aufgaben.filter((aufgabe) => aufgabe.completed);
          },
          async init() {
            await this.laden();
          },

          async hinzufuegen() {
            const text = this.neueAufgabe.trim();
            if (text === "") {
              return;
            }
            try {
              const antwortPost = await fetch(
                "http://127.0.0.1:8000/aufgaben",
                {
                  method: "POST",

                  headers: {
                    "Content-Type": "application/json",
                  },

                  body: JSON.stringify({
                    titel: text,
                  }),
                },
              );
              if (!antwortPost.ok) {
                alert("Aufgabe konnte nicht gespeichert werden.");
                return;
              }
              // hier nicht ganz gecheckt was abgeht
              await this.laden();
              this.neueAufgabe = "";
            } catch (error) {
              alert("Beim Senden ist ein Verbindungsfehler aufgetreten.");
              console.error(error);
            }
          },
          async statusAendern(aufgabe, event) {
            const neuerStatus = event.target.checked;
            try {
              const antwortStatus = await fetch(
                this.endpoint + "/aufgaben/" + aufgabe.id,
                {
                  method: "PATCH",

                  headers: {
                    "Content-Type": "application/json",
                  },

                  body: JSON.stringify({
                    completed: neuerStatus,
                  }),
                },
              );
              if (!antwortStatus.ok) {
                event.target.checked = aufgabe.completed;
                alert("Der Status konnte nicht gespeichert werden.");
                return;
              }

              aufgabe.completed = (await antwortStatus.json()).completed;
            } catch (error) {
              event.target.checked = aufgabe.completed;
              alert("Verbindungs- oder Verarbeitungsfehler.");
              console.error(error);
            }
          },

          async laden() {
            try {
              const getAufgabe = await fetch("http://127.0.0.1:8000/aufgaben");
              if (!getAufgabe.ok) {
                alert("Aufgaben konnten nicht geladen werden");
                return;
              }
              this.aufgaben = await getAufgabe.json();
            } catch (error) {
              alert(
                "Beim Laden ist ein Verbindungs- oder Verarbeitungsfehler aufgetreten.",
              );
              console.error(error);
            }
          },
        };
      }
    </script>
  </body>
</html>
