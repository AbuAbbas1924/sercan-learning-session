<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POST-Request</title>
    <script src="https://unpkg.com/alpinejs@3.x.x" defer></script>
  </head>

  <body>
    <div x-data="postDaten()">
      <h1>Text senden</h1>

      <form @submit.prevent="senden()">
        <label for="text">Dein Text:</label>
        <input
          id="text"
          type="text"
          x-model="neuerText"
          required
        />

        <button type="submit">Senden</button>
      </form>

      <pre x-text="JSON.stringify(antwort, null, 2)"></pre>
    </div>

    <script>
      function postDaten() {
        return {
          apiAdresse: "http://127.0.0.1:8000/",
          neuerText: "",
          antwort: null,

          async senden() {
            const response = await fetch(this.apiAdresse, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                text: this.neuerText,
              }),
            });

            this.antwort = await response.json();
          },
        };
      }
    </script>
  </body>
</html>
