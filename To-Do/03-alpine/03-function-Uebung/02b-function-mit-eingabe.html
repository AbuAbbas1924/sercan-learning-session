<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02b-function-grundlagen</title>
    <script src="https://unpkg.com/alpinejs"></script>
  </head>
  <body>
    <!--Deine Aufgabe:
1. Lege in x-data zwei Werte an:
   - benutzername: zunächst leer.
   - nachricht: zunächst „Bitte gib deinen Namen ein.“
2. Erstelle ein beschriftetes Eingabefeld und verbinde es mit x-model="benutzername".
3. Schreibe eine Funktion begruessen().
4. Die Funktion soll nachricht auf „Hallo, [eingegebener Name]!“ setzen.
5. Erstelle einen Button „Begrüßen“, der die Funktion aufruft.
6. Zeige die Nachricht mit x-text an.  -->

    <div
      x-data="{ 
        benutzername: '',
        nachricht: 'Bitte gib deinen Namen ein.',
        begruessen() {
            this.nachricht = 'Hallo, ' + this.benutzername + '!'
        }
        
        }"
    >
      <input type="text" x-model="benutzername" />
      <button type="button" @click="begruessen()">Begrüßen</button>
      <p x-text="nachricht"></p>
    </div>
  </body>
</html>
