<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02-function-grundlagen</title>
    <script src="https://unpkg.com/alpinejs" defer></script>
  </head>
  <body>
    <!-- Deine Aufgabe: Ein Klickzähler
1. Lege in x-data einen Wert anzahl mit dem Anfangswert 0 an.
2. Zeige ihn mit x-text auf der Seite an.
3. Definiere eine Funktion erhoehen(), die anzahl um 1 erhöht.
4. Erstelle einen Button „+1“, der diese Funktion aufruft.
5. Definiere eine zweite Funktion zuruecksetzen(), die anzahl wieder auf 0 setzt.
6. Erstelle den passenden „Reset“-Button. -->

    <div
      x-data="{ anzahl: 0, erhoehen() { this.anzahl += 1}, zuruecksetzen() { this.anzahl = 0} }"
    >
      <p x-text="anzahl"></p>
      <button type="button" @click="erhoehen()">+1</button>
      <button type="button" @click="zuruecksetzen()">Reset</button>
    </div>
  </body>
</html>
