<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldung</title>
    <script src="https://unpkg.com/alpinejs" defer></script>
</head>
<body>
    <form action="" x-data="Anmeldedaten()" @submit.prevent="anmelden">
        <input 
            type="text" 
            placeholder="Benutzername" 
            x-model="benutzername">

        <button type="submit">Anmelden</button>
        <button type="button" @click="zuruecksetzen()">Reset</button>

        <p x-text="nachricht"></p>
        
    </form>

    <script>
        function Anmeldedaten() {
            return {
                benutzername: '',
                nachricht: 'Bitte gib deinen Namen ein.',

                anmelden() {
                    if(this.benutzername.length >= 3) {
                        this.nachricht = 'Willkommen, ' + this.benutzername + '!'
                    } else {
                        this.nachricht = 'Der Name muss mindestens 3 Zeichen haben.'
                    }
                },
                
                zuruecksetzen() {
                    this.benutzername = ''
                    this.nachricht = 'Bitte gib deinen Namen ein.'
                }
            }
        }
    </script>
    
</body>
</html>
