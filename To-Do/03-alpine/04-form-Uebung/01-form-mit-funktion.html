<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://unpkg.com/alpinejs" defer></script>
  </head>
  <body>
    <!-- Deine Aufgabe: Eine kleine Anmeldung
1. Binde Alpine wie bisher mit defer ein.
2. Lege direkt beim <form> mit x-data diese Werte an:
   - benutzername: anfangs leer.
   - nachricht: anfangs „Bitte melde dich an.“
3. Erstelle ein beschriftetes Eingabefeld für den Benutzernamen:
   - Verbinde label und input über for und id.
   - Verbinde die Eingabe über x-model mit benutzername.
   - Nutze required und minlength="3".
4. Schreibe eine Funktion anmelden(), die nachricht auf „Willkommen, [Benutzername]!“ setzt.
5. Erstelle einen Button mit type="submit" und dem Text „Anmelden“.
6. Zeige die Nachricht innerhalb des Formulars mit x-text an.  -->
    <form
      action=""
      @submit.prevent="anmelden()"
      x-data="{ benutzername: '',
        nachricht: 'Bitte melde dich an.',
        anmelden() { 
            this.nachricht= 'Willkommen, ' + this.benutzername + '!'},
        reset() { 
            this.benutzername = ''
            this.nachricht = 'Bitte melde dich an'}
    }"
    >
      <label for="benutzername">Benutzername:</label>
      <input
        type="text"
        id="benutzername"
        name="benutzername"
        x-model="benutzername"
        required
        minlength="3"
      />
      <button type="submit">Anmelden</button>
      <button type="button" @click="reset()">Reset</button>
      <p x-text="nachricht"></p>
    </form>
  </body>
</html>
